[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sspd"
version = "1.3.2"
description = "SSH/SCP Project Delivery"
readme = "README.md"
authors = [
    { name = "Homer", email = "mdfilippov_2@edu.hse.ru" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    'bcrypt==4.3.0',
    'cffi==1.17.1',
    'cryptography==44.0.2',
    'invoke==2.2.0',
    'paramiko==4.0.0',
    'pycparser==2.22',
    'PyNaCl==1.5.0',
]

[project.urls]
GitHub = "https://github.com/MatveyFilippov/SSPD"

[tool.setuptools]
packages = { find = {} }

